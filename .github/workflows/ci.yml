name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop ]

jobs:
  backend-tests:
    runs-on: windows-latest   # because poller uses WMI (Windows-only)
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black
    
    - name: Lint with flake8
      run: |
        flake8 backend --count --max-complexity=10 --max-line-length=100 --statistics
    
    - name: Check formatting with black
      run: |
        black --check backend
    
    - name: Run unit tests (placeholder)
      run: |
        pytest backend/tests/ -v --cov=backend --cov-report=xml
      continue-on-error: true  # we'll add real tests later
    
    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend-tests:
    runs-on: ubuntu-latest  # React tests can run on Linux
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Lint (if ESLint configured)
      run: npx eslint src/ --max-warnings=0
      continue-on-error: true
    
    - name: Run tests
      run: npm test -- --passWithNoTests
    
    - name: Build React
      run: npm run build    